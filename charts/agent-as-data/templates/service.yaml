apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-as-data.fullname" . }}
  labels:
    {{- include "agent-as-data.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
{{- if ne (int .Values.service.port) 8080 }}
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http-8080
{{- end }}
    - port: {{ .Values.service.hamsPort }}
      targetPort: hams
      protocol: TCP
      name: hams
    - name: http-envoy-prom
      port: 15020
      protocol: TCP
      targetPort: 15020
  selector:
    app: {{ include "agent-as-data.name" . }}
