replicaCount: 1

image:
  repository: agent-as-data-be
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

config:
  database:
    url: "postgres://postgres:postgres@localhost:5432/agent_as_data"
