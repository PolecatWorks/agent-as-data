apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-as-data-mcp.fullname" . }}
  labels:
    {{- include "agent-as-data-mcp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.hamsPort }}
      targetPort: hams
      protocol: TCP
      name: hams
    - name: http-envoy-prom
      port: 15020
      protocol: TCP
      targetPort: 15020
  selector:
    app: {{ include "agent-as-data-mcp.name" . }}
