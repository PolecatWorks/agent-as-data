version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aad-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_as_data
    ports:
      - "5432:5432"
    volumes:
      - aad-pgdata:/var/lib/postgresql/data

volumes:
  aad-pgdata:
