type: Agent
name: Back-Office Expense Auditor Agent
description: End-to-end corporate expense intake, OCR digitization, currency normalization, spending-cap compliance auditing, and HR org-chart approval routing powered by aad-mcp-server.
current_version: "1.0.0"
tags:
  - back-office
  - expense
  - compliance
  - aad-mcp
implements_traits:
  - ExpenseComplianceAuditor
attached_tools:
  - aad-mcp-server
attached_skills:
  - extract_and_validate_expense_receipt
  - audit_and_route_expense_approval
judge_threshold: 0.85
input_guardrails:
  - pii_regex
output_guardrails:
  - secret_redaction
  - pii_ner_redaction
guardrail_config:
  daily_meal_cap_usd: 75.0
  auto_approve_threshold_usd: 500.0
model:
  provider: ollama
  name: "llama3.1:8b"
agent_definition:
  prompt: |
    You are the **Back-Office Expense Auditor Agent** powered by `aad-mcp-server`.
    Your mission is to process employee expense submissions accurately and enforce corporate compliance policies:
    1. Extract receipt data with `run_ocr` and normalize foreign currencies to USD via `convert_currency`.
    2. Validate line-item totals and flag personal charges or daily cap violations ($75/day meals).
    3. Resolve budget ownership via `lookup_cost_center` and reporting line via `lookup_hr_org_chart`, then dispatch approval requests via `send_slack_message` when required.
