<div class="relative inline-block text-left">
  <!-- Trigger Button (Compact, zero persistent layout footprint) -->
  <button type="button"
          [attr.data-testid]="testIdPrefix + '-trigger'"
          (click)="toggle($event)"
          (mouseenter)="show()"
          (mouseleave)="hide()"
          class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full font-label-md text-label-md border transition-all duration-150 cursor-pointer select-none"
          [ngClass]="isOpen ? 'bg-primary text-on-primary border-primary shadow-sm' : 'bg-surface-container-high text-on-surface-variant border-border-subtle hover:bg-surface-container-highest hover:text-on-surface'">
    <span class="material-symbols-outlined text-[16px]">help_outline</span>
    <span>{{ triggerLabel }}</span>
    <span *ngIf="isPinned" class="ml-0.5 text-[10px] bg-outline-variant/30 px-1 rounded font-normal text-on-surface">Pinned</span>
  </button>

  <!-- Transparent outside click dismiss backdrop (when pinned) -->
  <div *ngIf="isOpen && isPinned"
       class="fixed inset-0 z-40 bg-transparent"
       (click)="close($event)"></div>

  <!-- Floating Popover Card (Zero layout shift on workspace) -->
  <div *ngIf="isOpen"
       [attr.data-testid]="testIdPrefix + '-popover'"
       (mouseenter)="show()"
       (mouseleave)="hide()"
       class="absolute left-0 top-full mt-2 w-[440px] max-w-[90vw] bg-surface-container-lowest rounded-2xl shadow-lg border border-border-subtle z-50 overflow-hidden text-left animate-in fade-in zoom-in-95 duration-100">
    
    <!-- Popover Header -->
    <div class="p-space-md bg-surface-container border-b border-border-subtle text-on-surface flex items-start justify-between">
      <div class="space-y-1">
        <span *ngIf="badge" class="inline-block font-code text-[10px] uppercase tracking-wider text-primary bg-primary-container/20 px-2 py-0.5 rounded-full border border-primary/30">
          {{ badge }}
        </span>
        <h4 class="font-headline-sm text-headline-sm font-bold text-on-surface m-0 flex items-center gap-1.5">
          <span class="material-symbols-outlined text-[16px] text-accent-success">{{ icon }}</span>
          <span>{{ title }}</span>
        </h4>
      </div>
      <button type="button"
              [attr.data-testid]="testIdPrefix + '-close'"
              (click)="close($event)"
              class="text-on-surface-variant hover:text-on-surface p-1 rounded-lg transition-colors cursor-pointer"
              title="Close Guide">
        <span class="material-symbols-outlined text-[16px]">close</span>
      </button>
    </div>

    <!-- Popover Body -->
    <div class="p-space-lg space-y-4 font-body-sm text-body-sm text-on-surface">
      <!-- Plain-English Analogy -->
      <div *ngIf="analogyText" class="p-space-md bg-secondary-container/50 rounded-xl border border-outline/20 text-on-secondary-container leading-relaxed">
        <strong *ngIf="analogyTitle" class="text-on-surface font-semibold block mb-1">{{ analogyTitle }}:</strong>
        {{ analogyText }}
      </div>

      <!-- Feature / Tab Mappings -->
      <div *ngIf="tabMappings && tabMappings.length > 0" class="space-y-space-sm">
        <span class="font-code text-[10px] font-medium uppercase tracking-wider text-outline block">
          How this maps to this workspace:
        </span>

        @for (item of tabMappings; track item.title) {
          <div class="p-space-sm rounded-xl border border-border-subtle bg-surface-container-low space-y-1">
            <div class="font-label-md text-label-md font-semibold text-on-surface flex items-center gap-1.5">
              <span class="material-symbols-outlined text-[16px]" [ngClass]="item.iconColor || 'text-primary'">{{ item.icon }}</span>
              <span>{{ item.title }}</span>
            </div>
            <p class="text-on-surface-variant m-0 pl-5 font-body-sm text-body-sm leading-relaxed">
              {{ item.description }}
            </p>
          </div>
        }
      </div>

      <!-- Footer Link to Architecture Blueprint -->
      <div *ngIf="detailLink" class="pt-2 border-t border-border-subtle flex items-center justify-between">
        <span class="text-[11px] text-outline">Technical blueprint:</span>
        <a [routerLink]="detailLink"
           [attr.routerLink]="detailLink"
           [attr.data-testid]="testIdPrefix + '-detail-link'"
           (click)="close($event)"
           class="group inline-flex items-center gap-1 font-label-md text-label-md text-primary hover:text-primary-fixed transition-colors">
          <span>{{ detailLinkLabel }}</span>
          <span class="material-symbols-outlined text-[14px] transition-transform duration-150 group-hover:translate-x-0.5">arrow_forward</span>
        </a>
      </div>
    </div>
  </div>
</div>
