<div class="relative inline-block text-left">
  <!-- Trigger Button (Compact, zero persistent layout footprint) -->
  <button type="button"
          [attr.data-testid]="testIdPrefix + '-trigger'"
          (click)="toggle($event)"
          (mouseenter)="show()"
          (mouseleave)="hide()"
          class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold border transition-all duration-150 cursor-pointer select-none"
          [ngClass]="isOpen ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' : 'bg-indigo-50 text-indigo-700 border-indigo-200 hover:bg-indigo-100/80 hover:border-indigo-300'">
    <mat-icon class="!w-4 !h-4 !text-sm">help_outline</mat-icon>
    <span>{{ triggerLabel }}</span>
    <span *ngIf="isPinned" class="ml-0.5 text-[10px] bg-white/20 px-1 rounded font-normal">Pinned</span>
  </button>

  <!-- Transparent outside click dismiss backdrop (when pinned) -->
  <div *ngIf="isOpen && isPinned"
       class="fixed inset-0 z-40 bg-transparent"
       (click)="close($event)"></div>

  <!-- Floating Popover Card (Zero layout shift on workspace) -->
  <div *ngIf="isOpen"
       [attr.data-testid]="testIdPrefix + '-popover'"
       (mouseenter)="show()"
       (mouseleave)="hide()"
       class="absolute left-0 top-full mt-2 w-[440px] max-w-[90vw] bg-white rounded-2xl shadow-2xl border border-slate-200 z-50 overflow-hidden text-left animate-in fade-in zoom-in-95 duration-100">
    
    <!-- Popover Header -->
    <div class="p-4 bg-gradient-to-r from-slate-900 to-indigo-950 text-white flex items-start justify-between">
      <div class="space-y-1">
        <span *ngIf="badge" class="inline-block text-[10px] font-bold uppercase tracking-wider text-indigo-300 bg-indigo-500/20 px-2 py-0.5 rounded-full border border-indigo-500/30">
          {{ badge }}
        </span>
        <h4 class="text-sm font-black text-white m-0 flex items-center gap-1.5">
          <mat-icon class="!w-4 !h-4 !text-base text-emerald-400">{{ icon }}</mat-icon>
          <span>{{ title }}</span>
        </h4>
      </div>
      <button type="button"
              [attr.data-testid]="testIdPrefix + '-close'"
              (click)="close($event)"
              class="text-slate-400 hover:text-white p-1 rounded-lg transition-colors cursor-pointer"
              title="Close Guide">
        <mat-icon class="!w-4 !h-4 !text-base">close</mat-icon>
      </button>
    </div>

    <!-- Popover Body -->
    <div class="p-5 space-y-4 text-xs">
      <!-- Plain-English Analogy -->
      <div *ngIf="analogyText" class="p-3 bg-indigo-50/60 rounded-xl border border-indigo-100 text-slate-700 leading-relaxed">
        <strong *ngIf="analogyTitle" class="text-indigo-950 font-bold block mb-1">{{ analogyTitle }}:</strong>
        {{ analogyText }}
      </div>

      <!-- Feature / Tab Mappings -->
      <div *ngIf="tabMappings && tabMappings.length > 0" class="space-y-2.5">
        <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">
          How this maps to this workspace:
        </span>

        @for (item of tabMappings; track item.title) {
          <div class="p-2.5 rounded-xl border border-slate-100 bg-slate-50/60 space-y-1">
            <div class="font-bold text-slate-800 flex items-center gap-1.5">
              <mat-icon class="!w-4 !h-4 !text-sm" [ngClass]="item.iconColor">{{ item.icon }}</mat-icon>
              <span>{{ item.title }}</span>
            </div>
            <p class="text-slate-500 m-0 pl-5 text-[11px] leading-relaxed">
              {{ item.description }}
            </p>
          </div>
        }
      </div>

      <!-- Footer Link to Architecture Blueprint -->
      <div *ngIf="detailLink" class="pt-2 border-t border-slate-100 flex items-center justify-between">
        <span class="text-[11px] text-slate-400">Technical blueprint:</span>
        <a [routerLink]="detailLink"
           [attr.routerLink]="detailLink"
           [attr.data-testid]="testIdPrefix + '-detail-link'"
           (click)="close($event)"
           class="group inline-flex items-center gap-1 text-xs font-semibold text-indigo-600 hover:text-indigo-800 transition-colors">
          <span>{{ detailLinkLabel }}</span>
          <mat-icon class="!w-3.5 !h-3.5 !text-sm transition-transform duration-150 group-hover:translate-x-0.5">arrow_forward</mat-icon>
        </a>
      </div>
    </div>
  </div>
</div>
