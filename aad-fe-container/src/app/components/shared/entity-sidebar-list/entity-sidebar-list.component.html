<div [ngClass]="isCollapsed ? 'w-16' : 'w-72'" class="h-full bg-white border-r border-slate-200 shadow-sm flex flex-col transition-all duration-300 z-10 shrink-0 overflow-hidden">
  
  <!-- Sidebar Header -->
  <div class="border-b border-slate-100 flex flex-col shrink-0">
    <!-- Check if a custom header was projected -->
    <div class="w-full relative">
      <ng-content select="[sidebar-header]" *ngIf="useCustomHeader"></ng-content>
      
      <!-- Default Header (fallback if no custom header is projected) -->
      <div *ngIf="!useCustomHeader" class="p-4 flex items-center shrink-0 h-14" [ngClass]="isCollapsed ? 'justify-center px-0' : 'justify-between'">
        <div class="flex items-center gap-2 overflow-hidden" *ngIf="!isCollapsed">
          <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold shrink-0">
            <mat-icon class="!w-5 !h-5 !text-xl">{{ headerIcon }}</mat-icon>
          </div>
          <span class="font-black text-slate-800 text-lg whitespace-nowrap">{{ headerTitle }}</span>
        </div>
        <button mat-icon-button (click)="toggleSidebar()" class="text-slate-400 hover:text-slate-700" [title]="isCollapsed ? 'Expand Sidebar' : 'Collapse Sidebar'">
          <mat-icon>{{ isCollapsed ? 'chevron_right' : 'chevron_left' }}</mat-icon>
        </button>
      </div>
    </div>
  </div>

  <!-- Search -->
  <div class="p-3 border-b border-slate-100 shrink-0" *ngIf="!isCollapsed">
    <div class="relative">
      <mat-icon class="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 !w-4 !h-4 !text-base">search</mat-icon>
      <input type="text" [placeholder]="searchPlaceholder"
             class="w-full pl-9 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all"
             [(ngModel)]="searchQuery"
             (ngModelChange)="onSearchChange()" />
    </div>
  </div>

  <!-- Virtual Scrolling List -->
  <div class="flex-1 min-h-0 overflow-hidden flex flex-col relative">
    <div *ngIf="items.length === 0 && !isCollapsed" class="text-center py-8 text-slate-400 text-xs">
      {{ emptyMessage }}
    </div>

    <!-- The actual scroll viewport -->
    <cdk-virtual-scroll-viewport [itemSize]="itemSize" class="h-full w-full overflow-x-hidden custom-scrollbar">
      <div class="px-2 pb-2">
        <ng-container *cdkVirtualFor="let item of items; trackBy: trackById">
          <!-- Wrapper padding to match original spacing -->
          <div class="pt-2">
            <ng-container *ngTemplateOutlet="itemTemplate; context: { $implicit: item, collapsed: isCollapsed }"></ng-container>
          </div>
        </ng-container>
      </div>
    </cdk-virtual-scroll-viewport>
  </div>
</div>
