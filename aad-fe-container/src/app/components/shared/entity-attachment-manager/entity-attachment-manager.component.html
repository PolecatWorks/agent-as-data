<div [ngClass]="containerClasses">
  <h4 [ngClass]="titleClasses">{{ title }}</h4>

  @if (isEditing) {
    <div class="space-y-2">
      <div class="relative">
        <input type="text" [(ngModel)]="searchQuery" placeholder="Search available entities to attach..."
               class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all" />
      </div>

      <div class="flex flex-wrap gap-2 p-3 bg-white rounded-xl border border-slate-200 max-h-36 overflow-y-auto">
        @for (e of filteredAvailableEntities; track e.id) {
          <button mat-stroked-button color="primary" class="!rounded-lg !text-xs !font-bold" [matTooltip]="e.description || 'No description available'" (click)="onAttach(e.id)">
            + {{ e.name }}
          </button>
        } @empty {
          <span class="text-xs text-slate-400 italic">No entities available to attach.</span>
        }
      </div>
    </div>
  }

  <div class="space-y-2 pt-2" [class.border-t]="isEditing" [class.border-slate-200]="isEditing">
    <div class="flex flex-wrap gap-2">
      @for (id of attachedIds; track id) {
        <span [ngClass]="pillClasses" [matTooltip]="getEntityDescription(id)">
          {{ getEntityName(id) }}
          @if (isEditing) {
            <button [ngClass]="detachButtonClasses" (click)="onDetach(id)">×</button>
          }
        </span>
      } @empty {
        <span class="text-xs text-slate-400 italic">No entities attached.</span>
      }
    </div>
  </div>
</div>
