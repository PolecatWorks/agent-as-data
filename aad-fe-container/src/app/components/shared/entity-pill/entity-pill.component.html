<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[10px] font-bold border transition-colors"
      [ngClass]="themeClasses">
  @if (icon) {
    <mat-icon class="!w-3.5 !h-3.5 !text-[14px] leading-none flex items-center justify-center">{{ icon }}</mat-icon>
  }
  {{ label }}
  @if (isRemovable) {
    <button type="button" class="flex items-center justify-center -mr-1 p-0.5 rounded-full hover:bg-black/10 transition-colors cursor-pointer border-none bg-transparent"
            (click)="onRemove($event)">
      <mat-icon class="!w-3 !h-3 !text-[12px] leading-none opacity-70 hover:opacity-100 flex items-center justify-center">close</mat-icon>
    </button>
  }
</span>
