<div class="p-6 max-w-7xl mx-auto space-y-6">
  <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <mat-icon class="text-emerald-600">account_tree</mat-icon>
      <div>
        <h1 class="text-xl font-bold text-slate-800 m-0">Agent Network & Delegation Graph Visualizer</h1>
        <p class="text-sm text-slate-500 m-0">Interactive Mermaid diagram renderer displaying sub-agent delegation topologies and skill bindings</p>
      </div>
    </div>
    <button mat-flat-button color="primary" (click)="renderDiagram()">
      <mat-icon>refresh</mat-icon> Re-Render Graph
    </button>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2">
      <mat-card class="rounded-xl border border-slate-200">
        <mat-card-header class="border-b border-slate-100 pb-3">
          <mat-card-title class="text-base font-bold text-slate-800">Visual Delegation Diagram</mat-card-title>
        </mat-card-header>
        <mat-card-content class="p-6 flex justify-center items-center min-h-[400px] bg-slate-50 rounded-b-xl">
          <div #mermaidContainer class="w-full overflow-x-auto"></div>
        </mat-card-content>
      </mat-card>
    </div>

    <div>
      <mat-card class="rounded-xl border border-slate-200">
        <mat-card-header class="border-b border-slate-100 pb-3">
          <mat-card-title class="text-base font-bold text-slate-800">Mermaid Definition DSL</mat-card-title>
        </mat-card-header>
        <mat-card-content class="p-4 space-y-4">
          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Mermaid Flowchart Code</mat-label>
            <textarea matInput rows="14" class="font-mono text-xs" [(ngModel)]="mermaidCode" (ngModelChange)="renderDiagram()"></textarea>
          </mat-form-field>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
