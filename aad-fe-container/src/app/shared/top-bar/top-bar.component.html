<header class="w-full px-6 flex items-center justify-between h-14 sticky top-0 z-50 bg-surface-container-lowest border-b border-border-subtle shrink-0">
  <div class="flex items-center gap-6">
    <div class="flex items-center gap-2">
      <span class="material-symbols-outlined text-primary text-[22px]">hub</span>
      <span class="text-headline-sm font-headline-sm font-bold text-on-surface tracking-tight">AgentHub</span>
      <ng-content select="[left-branding]"></ng-content>
    </div>
    <nav class="hidden xl:flex items-center gap-6 text-label-md font-label-md mt-1">
      <a routerLink="/semantic-search" routerLinkActive="text-primary border-b-2 border-primary font-medium" [routerLinkActiveOptions]="{exact: false}" class="text-on-surface-variant hover:text-on-surface pb-3.5 pt-3.5 transition-colors">Discovery</a>
      <a routerLink="/knowledge-inspector" routerLinkActive="text-primary border-b-2 border-primary font-medium" [routerLinkActiveOptions]="{exact: false}" class="text-on-surface-variant hover:text-on-surface pb-3.5 pt-3.5 transition-colors">Knowledge</a>
      <a routerLink="/skills-registry" routerLinkActive="text-primary border-b-2 border-primary font-medium" [routerLinkActiveOptions]="{exact: false}" class="text-on-surface-variant hover:text-on-surface pb-3.5 pt-3.5 transition-colors">Registry</a>
      <a routerLink="/workbench" routerLinkActive="text-primary border-b-2 border-primary font-medium" [routerLinkActiveOptions]="{exact: false}" class="text-on-surface-variant hover:text-on-surface pb-3.5 pt-3.5 transition-colors">Workbenches</a>
      <a routerLink="/interactive-testing" routerLinkActive="text-primary border-b-2 border-primary font-medium" [routerLinkActiveOptions]="{exact: false}" class="text-on-surface-variant hover:text-on-surface pb-3.5 pt-3.5 transition-colors">Testing</a>
      <a routerLink="/tools" routerLinkActive="text-primary border-b-2 border-primary font-medium" [routerLinkActiveOptions]="{exact: false}" class="text-on-surface-variant hover:text-on-surface pb-3.5 pt-3.5 transition-colors">Tools</a>
    </nav>
    <ng-content select="[left-actions]"></ng-content>
  </div>
  
  <div class="flex-1 flex justify-center items-center">
    <ng-content select="[center-content]"></ng-content>
  </div>

  <div class="flex items-center gap-4">
    <ng-content select="[right-actions]"></ng-content>
    <ng-content></ng-content>
  </div>
</header>
