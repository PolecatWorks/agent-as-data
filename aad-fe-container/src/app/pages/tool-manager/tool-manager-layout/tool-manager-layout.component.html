<div class="h-full w-full flex flex-col bg-slate-50 overflow-hidden">
  <app-top-navbar
    workspaceTitle="Tools Registry"
    workspaceIcon="dns"
    [conceptGuideConfig]="{
      badge: 'Tool Trait Ecosystem',
      title: 'Workspace Tools (Tool Manager)',
      icon: 'dns',
      triggerLabel: 'What are Tools?',
      analogyTitle: 'The Toolbelt Analogy',
      analogyText: 'Think of Tools like physical instruments on an AI teammate toolbelt. They connect agents to filesystems, code interpreters, terminal commands, and external APIs with pre-tool safety checks.',
      tabMappings: conceptGuideMappings,
      detailLink: '/detail',
      detailLinkLabel: 'Explore Tool Architecture',
      testIdPrefix: 'tools-concept'
    }">
    <button primary-action mat-flat-button color="primary" class="!rounded-lg !px-4 !font-bold h-9 mr-2" routerLink="/tools/new">
      <mat-icon class="mr-1">add</mat-icon> New Tool
    </button>
  </app-top-navbar>

  <div class="flex-1 flex flex-row min-h-0 overflow-hidden relative">
    <!-- Left Sidebar -->
    <app-entity-sidebar-list
      [(isCollapsed)]="isSidebarCollapsed"
      [items]="filteredServers"
      [itemTemplate]="serverCardTemplate"
      [itemSize]="96"
      searchPlaceholder="Search tools by name..."
      emptyMessage="No matching tools found."
      (searchChange)="searchQuery = $event">
    </app-entity-sidebar-list>

    <ng-template #serverCardTemplate let-s let-collapsed="collapsed">
      <div class="group p-3 rounded-xl border transition-all cursor-pointer bg-white"
           [routerLink]="['/tools', s.id]"
           routerLinkActive="border-indigo-500 shadow-sm ring-1 ring-indigo-500/20"
           [routerLinkActiveOptions]="{exact: true}"
           [class.border-slate-200]="true"
           [class.hover:border-slate-300]="true"
           [matTooltip]="s.server_name"
           matTooltipPosition="right"
           [matTooltipDisabled]="!collapsed">
        
        <div class="flex flex-col w-full" *ngIf="!collapsed">
          <div class="flex justify-between items-start">
            <div class="flex items-start gap-3 overflow-hidden flex-1">
              <mat-icon class="shrink-0 text-slate-400 mt-0.5">dns</mat-icon>
              <div class="flex-1 min-w-0">
                <h5 class="text-sm font-bold text-slate-900 m-0 truncate leading-tight mt-0.5">{{ s.server_name }}</h5>
              </div>
            </div>
            <div class="flex items-center gap-1 ml-2 shrink-0">
              <span class="px-2.5 py-0.5 bg-emerald-100 text-emerald-800 text-[10px] font-bold rounded-md">
                {{ s.tools_count || 0 }}
              </span>
            </div>
          </div>
          <p class="text-xs text-slate-500 m-0 mt-2 line-clamp-2 leading-relaxed">
            {{ s.description || 'No description' }}
          </p>
        </div>
        
        <div class="flex justify-center" *ngIf="collapsed">
          <div class="relative">
            <mat-icon class="text-slate-400">dns</mat-icon>
            <div class="absolute -top-1 -right-1.5 w-3 h-3 bg-emerald-500 border border-white rounded-full"></div>
          </div>
        </div>
      </div>
    </ng-template>

    

    <!-- Main Content Workspace -->
    <div class="flex-1 flex flex-col min-w-0 bg-slate-50">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
