<div class="h-full w-full flex flex-col bg-slate-50 overflow-hidden">
  <!-- Top Bar -->
  <app-top-navbar
    workspaceTitle="Agents Registry"
    workspaceIcon="smart_toy"
    [conceptGuideConfig]="{
      badge: '3. Declarative AI Teammates',
      title: 'Digital Teammates (Agents)',
      icon: 'smart_toy',
      triggerLabel: 'What are Agents?',
      analogyTitle: 'The Digital Teammate Analogy',
      analogyText: 'Think of Agents like specialized digital teammates. Each agent has a clear job description, core personality, assigned skills, and verified trait contracts determining what they can and cannot do.',
      tabMappings: conceptGuideMappings,
      detailLink: '/detail',
      detailLinkLabel: 'Explore Agent Architecture',
      testIdPrefix: 'agents-concept'
    }">
    <button primary-action mat-flat-button color="primary" class="!rounded-lg !px-4 !font-bold h-9" (click)="createNewAgent()">
      <mat-icon class="mr-1">add</mat-icon> New Agent
    </button>
  </app-top-navbar>

  <div class="flex-1 flex flex-row min-h-0 overflow-hidden relative">
    <!-- Left Sidebar -->
    <app-entity-sidebar-list
      [(isCollapsed)]="isSidebarCollapsed"
      [items]="getFilteredAgents()"
      [itemTemplate]="agentCardTemplate"
      [itemSize]="96"
      searchPlaceholder="Search agents by name..."
      emptyMessage="No matching agents found."
      (searchChange)="searchQuery = $event">
    </app-entity-sidebar-list>

    <ng-template #agentCardTemplate let-agent let-collapsed="collapsed">
      <div class="group p-3 rounded-xl border transition-all cursor-pointer bg-white border-slate-200 hover:border-slate-300"
           (click)="onSelectAgent(agent)"
           routerLinkActive="!border-indigo-500 !shadow-sm !ring-1 !ring-indigo-500/20"
           [routerLink]="['/agents', agent.id]">
        <div class="flex items-start justify-between gap-2">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 mb-1">
              <mat-icon class="!w-4 !h-4 text-[16px] text-indigo-500" [matTooltip]="'Model: ' + (agent.model || 'Unknown')">smart_toy</mat-icon>
              <h3 class="font-bold text-slate-900 m-0 truncate text-sm" [matTooltip]="agent.name">{{ agent.name }}</h3>
            </div>
            <p class="text-xs text-slate-500 m-0 line-clamp-2 leading-relaxed" *ngIf="!collapsed" [matTooltip]="agent.description || 'No description'">
              {{ agent.description || 'No description provided.' }}
            </p>
          </div>
          <div *ngIf="!collapsed && (agent.attached_skills?.length || agent.attached_tools?.length)" class="flex flex-col items-end gap-1 shrink-0">
            <span *ngIf="agent.attached_skills?.length" class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-md bg-teal-50 text-[10px] font-bold text-teal-700 ring-1 ring-inset ring-teal-600/20" matTooltip="Attached Skills">
              <mat-icon class="!w-3 !h-3 text-[12px]">bolt</mat-icon> {{ agent.attached_skills.length }}
            </span>
            <span *ngIf="agent.attached_tools?.length" class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-md bg-blue-50 text-[10px] font-bold text-blue-700 ring-1 ring-inset ring-blue-600/20" matTooltip="Attached Tools">
              <mat-icon class="!w-3 !h-3 text-[12px]">build</mat-icon> {{ agent.attached_tools.length }}
            </span>
          </div>
        </div>
      </div>
    </ng-template>

    <!-- Main Content Area with Router Outlet -->
    <div class="flex-1 min-w-0 h-full overflow-hidden bg-white/50 relative" [class.ml-16]="isSidebarCollapsed">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
