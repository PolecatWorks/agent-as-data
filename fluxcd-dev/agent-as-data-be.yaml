apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agent-as-data-be
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: agent-as-data
      version: "0.1.0"
      sourceRef:
        kind: HelmRepository
        name: agent-as-data
        namespace: flux-system
  values:
    config:
      database:
        url: "postgres://postgres:postgres@aad-postgres:5432/agent_as_data"
