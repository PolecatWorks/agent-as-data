kind: Project
apiVersion: garden.io/v2
name: agent-as-data

variables:
  pr-number: ${local.env.PR_NUMBER || "local"}
  kube-context: "${local.env.GARDEN_KUBECONTEXT || (local.env.CI == 'true' ? 'local' : 'kubernetes-admin@kubernetes')}"
  aad-be-image: ${local.env.AAD_BE_IMAGE || "ghcr.io/polecatworks/agent-as-data-be"}
  aad-be-tag: ${local.env.AAD_BE_TAG || "main"}
  aad-fe-image: ${local.env.AAD_FE_IMAGE || "ghcr.io/polecatworks/agent-as-data-fe"}
  aad-fe-tag: ${local.env.AAD_FE_TAG || "main"}

providers:
  - name: kubernetes
    context: ${var.kube-context}
    namespace: ${environment.namespace}
    environments:
      - pr
      - local

environments:
  - name: local
    defaultNamespace: agent-as-data-${local.env.USER}
  - name: pr
    defaultNamespace: agent-as-data-pr-${var.pr-number}

---
kind: Deploy
type: kubernetes
name: ghcr-external-secret
description: "Creates GHCR image pull secret directly from GHCR_TOKEN environment variable"
spec:
  manifests:
    - apiVersion: v1
      kind: Secret
      metadata:
        name: ghcr-secret
      type: kubernetes.io/dockerconfigjson
      stringData:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "username": "${local.env.GHCR_USER || 'bengreen'}",
                "password": "${local.env.GHCR_TOKEN || ''}",
                "auth": "${base64Encode((local.env.GHCR_USER || 'bengreen') + ':' + (local.env.GHCR_TOKEN || ''))}"
              }
            }
          }

---
kind: Deploy
type: kubernetes
name: postgres-test
description: "Ephemeral PostgreSQL database for integration tests & dev"
spec:
  manifests:
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: postgres-test-init
      data:
        init.sql: |
          CREATE EXTENSION IF NOT EXISTS vector;
    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: postgres-test
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: postgres-test
        template:
          metadata:
            labels:
              app: postgres-test
          spec:
            containers:
              - name: postgres
                image: pgvector/pgvector:pg16
                env:
                  - name: POSTGRES_DB
                    value: agent_as_data
                  - name: POSTGRES_USER
                    value: postgres
                  - name: POSTGRES_PASSWORD
                    value: postgres
                ports:
                  - containerPort: 5432
                    name: postgres
                volumeMounts:
                  - name: init-script
                    mountPath: /docker-entrypoint-initdb.d
            volumes:
              - name: init-script
                configMap:
                  name: postgres-test-init
    - apiVersion: v1
      kind: Service
      metadata:
        name: postgres-test
      spec:
        ports:
          - port: 5432
            targetPort: 5432
            name: postgres
        selector:
          app: postgres-test

---
kind: Deploy
type: helm
name: agent-as-data-be
description: "Deploy Agent-As-Data Rust backend service"
dependencies:
  - deploy.postgres-test
  - deploy.ghcr-external-secret
  - build.get-be-sha
source:
  path: charts/agent-as-data
include:
  - "**/*"
spec:
  values:
    image:
      repository: '${local.env.AAD_BE_IMAGE != null ? local.env.AAD_BE_IMAGE : actions.build.get-be-sha.outputs.image}'
      tag: '${local.env.AAD_BE_TAG != null ? local.env.AAD_BE_TAG : actions.build.get-be-sha.outputs.tag}'
      pullPolicy: '${local.env.AAD_BE_IMAGE != null ? "IfNotPresent" : "Always"}'
    imagePullSecrets:
      - name: ghcr-secret
    config:
      database:
        url:
          url: postgresql://postgres:postgres@postgres-test:5432/agent_as_data

---
kind: Deploy
type: kubernetes
name: agent-as-data-fe
description: "Deploy Agent-As-Data Angular frontend service"
dependencies:
  - deploy.ghcr-external-secret
  - build.get-fe-sha
spec:
  manifests:
    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: agent-as-data-fe
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: agent-as-data-fe
        template:
          metadata:
            labels:
              app: agent-as-data-fe
          spec:
            imagePullSecrets:
              - name: ghcr-secret
            containers:
              - name: fe
                image: '${local.env.AAD_FE_IMAGE != null ? local.env.AAD_FE_IMAGE : actions.build.get-fe-sha.outputs.image}:${local.env.AAD_FE_TAG != null ? local.env.AAD_FE_TAG : actions.build.get-fe-sha.outputs.tag}'
                imagePullPolicy: '${local.env.AAD_FE_IMAGE != null ? "IfNotPresent" : "Always"}'
                ports:
                  - containerPort: 80
                    name: http
    - apiVersion: v1
      kind: Service
      metadata:
        name: agent-as-data-fe
      spec:
        ports:
          - port: 80
            targetPort: 80
            name: http
        selector:
          app: agent-as-data-fe

---
kind: Build
type: exec
name: get-be-sha
description: "Get git commit SHA and image repo for backend files"
buildAtSource: true
spec:
  command:
    - "/bin/bash"
    - "-c"
    - |
      BACKEND_SHA=$(git log -1 --format=%H -- aad-be-container/ .github/workflows/aad-be-docker-publish.yml)
      MAIN_SHA=$(git log -1 --format=%H origin/main -- aad-be-container/ .github/workflows/aad-be-docker-publish.yml 2>/dev/null || echo "")
      HAS_UNCOMMITTED=$(git status --porcelain -- aad-be-container/ .github/workflows/aad-be-docker-publish.yml)
      IMAGE="ghcr.io/polecatworks/agent-as-data-be"
      if { [ -n "$HAS_UNCOMMITTED" ] || [ "$BACKEND_SHA" != "$MAIN_SHA" ]; } && [ -n "$BACKEND_SHA" ] && docker manifest inspect "$IMAGE:sha-$BACKEND_SHA" >/dev/null 2>&1; then
        TAG="sha-$BACKEND_SHA"
      else
        TAG="main"
      fi
      if [ -n "$GARDEN_ACTION_OUTPUTS_JSON_PATH" ]; then
        echo "{\"image\": \"$IMAGE\", \"tag\": \"$TAG\"}" > "$GARDEN_ACTION_OUTPUTS_JSON_PATH"
      elif [ -n "$GARDEN_ACTION_JSON_OUTPUTS_PATH" ]; then
        echo "{\"image\": \"$IMAGE\", \"tag\": \"$TAG\"}" > "$GARDEN_ACTION_JSON_OUTPUTS_PATH"
      else
        echo "Outputs path not defined by Garden, skipping writing outputs file"
      fi

---
kind: Build
type: exec
name: get-fe-sha
description: "Get git commit SHA and image repo for frontend files"
buildAtSource: true
spec:
  command:
    - "/bin/bash"
    - "-c"
    - |
      FRONTEND_SHA=$(git log -1 --format=%H -- aad-fe-container/ .github/workflows/aad-fe-docker-publish.yml)
      MAIN_SHA=$(git log -1 --format=%H origin/main -- aad-fe-container/ .github/workflows/aad-fe-docker-publish.yml 2>/dev/null || echo "")
      HAS_UNCOMMITTED=$(git status --porcelain -- aad-fe-container/ .github/workflows/aad-fe-docker-publish.yml)
      IMAGE="ghcr.io/polecatworks/agent-as-data-fe"
      if { [ -n "$HAS_UNCOMMITTED" ] || [ "$FRONTEND_SHA" != "$MAIN_SHA" ]; } && [ -n "$FRONTEND_SHA" ] && docker manifest inspect "$IMAGE:sha-$FRONTEND_SHA" >/dev/null 2>&1; then
        TAG="sha-$FRONTEND_SHA"
      else
        TAG="main"
      fi
      if [ -n "$GARDEN_ACTION_OUTPUTS_JSON_PATH" ]; then
        echo "{\"image\": \"$IMAGE\", \"tag\": \"$TAG\"}" > "$GARDEN_ACTION_OUTPUTS_JSON_PATH"
      elif [ -n "$GARDEN_ACTION_JSON_OUTPUTS_PATH" ]; then
        echo "{\"image\": \"$IMAGE\", \"tag\": \"$TAG\"}" > "$GARDEN_ACTION_JSON_OUTPUTS_PATH"
      else
        echo "Outputs path not defined by Garden, skipping writing outputs file"
      fi

