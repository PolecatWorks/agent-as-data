name: CI Workflow

on:
  pull_request:

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'aad-be-container/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'aad-fe-container/**'
              - '.github/workflows/ci.yml'
            helm:
              - 'charts/**'
              - '.github/workflows/ci.yml'

  backend-test:
    name: Build & Test Backend
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_as_data
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Cargo Check
        run: cargo check --manifest-path aad-be-container/Cargo.toml

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/agent_as_data
        run: cargo test --manifest-path aad-be-container/Cargo.toml

  frontend-test:
    name: Build & Test Frontend
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: aad-fe-container/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: aad-fe-container

      - name: Run Frontend Build
        run: npm run build
        working-directory: aad-fe-container

      - name: Run Frontend Tests
        run: npm run test -- --watch=false --browsers=ChromeHeadless
        working-directory: aad-fe-container

  helm-lint:
    name: Helm Chart Lint
    needs: detect-changes
    if: needs.detect-changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm Chart
        run: helm lint charts/agent-as-data
